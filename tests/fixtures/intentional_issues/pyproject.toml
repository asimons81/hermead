[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intentional-issues"
version = "0.1.0"
description = "Test fixture for HermeAd"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = []

[tool.mypy]
strict = true
