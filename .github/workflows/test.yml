name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check hermead/

      - name: Type check with mypy
        run: mypy hermead/ --ignore-missing-imports

      - name: Test with pytest
        run: pytest tests/ -v

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install dist/*.whl
          wheel-smoke/bin/python -c "import hermead; assert hermead.__version__ == '0.2.0'; assert callable(hermead.register)"
